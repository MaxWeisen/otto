version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "queries"
    gen:
      go:
        package: "store"
        out: "internal/store"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          # Never serialize the session token hash.
          - column: "sessions.token"
            go_struct_tag: 'json:"-"'
          # Read and write money exactly and serialize it as a decimal string.
          - column: "maintenance_records.cost"
            go_type:
              import: "github.com/maxweisen/otto/backend/internal/money"
              type: "Amount"
              pointer: true
            nullable: true
